<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
<meta name="color-scheme" content="dark" />
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  font-src https://cdn.jsdelivr.net data:;
  img-src 'self' data: blob: https:;
  connect-src https://*.supabase.co wss://*.supabase.co;
  worker-src 'self';
  manifest-src 'self';
  base-uri 'none';
  form-action 'none';
" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Aetherfall · 에테르폴</title>
<meta name="description" content="균열 아래로 내려가는 액션 RPG. 다섯 직업, 절차적으로 만들어지는 층, 그리고 끝을 알 수 없는 깊이." />
<meta name="theme-color" content="#0a0d16" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Aetherfall" />

<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./assets/icon-192.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="./css/game.css" />

<!--
  Aetherfall — 단일 페이지 액션 RPG
  ------------------------------------------------------------------
  · 빌드 도구 없이 ES 모듈로 바로 돌아갑니다. 외부 의존성은 두 개뿐입니다.
      Pretendard(글꼴), @supabase/supabase-js v2(로그인·기록 저장)
  · 코드 구조
      js/core    루프에 필요한 바닥 (입력, 소리, 설정, 사양 측정, 수학)
      js/render  카메라, 이펙트, 실제 그리기
      js/game    직업·스킬·적·던전·아이템·성장과 게임 규칙
      js/ui      화면과 HUD
      js/net     Supabase 연동
      js/pwa     설치 안내와 서비스 워커
  · 서버 쪽 표(af_profiles / af_saves / af_runs)와 함수(af_submit_run,
    af_leaderboard, af_touch_profile)는 이미 만들어져 있습니다.
    기록은 서버에서 상식 범위를 넘는 값을 걸러 냅니다.
-->
</head>
<body>

<div id="app">
  <canvas id="stage" aria-label="게임 화면"></canvas>

  <div id="hud" class="hud" hidden></div>

  <div id="screens" class="screens"></div>

  <div id="overlays" class="overlays"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal" class="modal" hidden></div>

  <div id="rotate" class="rotate" hidden>
    <div class="rotate__inner">
      <div class="rotate__phone"></div>
      <b>가로로 돌려 주세요</b>
      <p>Aetherfall은 가로 화면에 맞춰 만들어졌습니다.</p>
    </div>
  </div>

  <div id="fps" class="fps" hidden></div>

  <div id="boot" class="boot">
    <div class="boot__logo">AETHERFALL</div>
    <div class="boot__bar"><i></i></div>
    <p class="boot__msg">균열을 여는 중…</p>
  </div>
</div>

<noscript>
  <div class="noscript">이 게임을 즐기려면 자바스크립트를 켜 주세요.</div>
</noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
